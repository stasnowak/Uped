name: Release

# Pushing a tag such as v0.1.0 publishes uped_linux_{amd64,arm64}.tar.gz and
# checksums.txt as a GitHub Release (what install.sh downloads) and a
# multi-arch image to ghcr.io/stasnowak/uped. Tags with a "-" (v0.2.0-rc1)
# become pre-releases: install.sh's "latest" and the image's "latest" skip them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Release binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Build tarballs and checksums.txt
        run: make cross VERSION="$GITHUB_REF_NAME"
      - name: Check them
        run: |
          set -eux
          cd dist
          sha256sum -c checksums.txt
          test "$(wc -l < checksums.txt)" -eq 2
          tar -xzf uped_linux_amd64.tar.gz -O uped > /tmp/uped
          chmod +x /tmp/uped
          test "$(/tmp/uped --version)" = "uped $GITHUB_REF_NAME"
      - name: Install the tarball with install.sh
        run: sh install.sh --binary dist/uped_linux_amd64.tar.gz --prefix "$RUNNER_TEMP/uped"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/uped_linux_amd64.tar.gz
            dist/uped_linux_arm64.tar.gz
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  image:
    name: Container image
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Image names must be lowercase; the repository is stasnowak/Uped.
          images: ghcr.io/stasnowak/uped
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
